name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  # 守卫：仅当被推的标签提交在 main 上时才继续。tag push 不携带分支信息，
  # 用「标签 commit 是否为 origin/main 的祖先」判定，避免在开发分支打标签误触发发布。
  preflight:
    runs-on: ubuntu-latest
    outputs:
      on-main: ${{ steps.check.outputs.on-main }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        shell: bash
        run: |
          git fetch origin main
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "on-main=true" >> "$GITHUB_OUTPUT"
            echo "标签在 main 上，继续发布"
          else
            echo "on-main=false" >> "$GITHUB_OUTPUT"
            echo "::notice::标签提交不在 main 分支上，跳过发布（仅 main 触发构建）"
          fi

  build-windows:
    needs: preflight
    if: needs.preflight.outputs.on-main == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1
      - name: Locate rc.exe (embed-resource checks $RC first)
        shell: pwsh
        run: |
          $rc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter rc.exe |
                Where-Object { $_.FullName -match '\\x64\\rc\.exe$' } |
                Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $rc) { Write-Error "rc.exe not found"; exit 1 }
          "RC=$($rc.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "using RC=$($rc.FullName)"
      - uses: Swatinem/rust-cache@v2
      # 前端必须先于 cargo：custom-protocol 是编译期把 ui/dist 打进二进制
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build UI
        working-directory: ui
        shell: bash
        run: |
          npm ci
          npm run build
          for p in index overlay pin settings history about; do
            [ -f "dist/$p.html" ] || { echo "::error::dist/$p.html 未产出（vite.config.js 的 rollupOptions.input 漏页）"; exit 1; }
          done
      # 根目录 CLI（tauri 只装在根 package.json）；tauri build 同时产出
      # target/release/capshot.exe（custom-protocol 默认开）与 NSIS 安装包
      - name: Install root CLI
        run: npm ci
      - name: Tauri build (exe + NSIS installer)
        run: npm run tauri build -- --bundles nsis
      - run: cargo build --release -p capture-windows --example probe
      # 发布二进制自检：判据与两个坑见 scripts/verify-embed.sh（与 ci.yml / build-macos 同一份）
      - name: Verify binary embeds UI (custom-protocol)
        shell: bash
        run: bash scripts/verify-embed.sh target/release/capshot.exe
      - name: Package
        shell: pwsh
        run: |
          mkdir pkg
          Copy-Item target/release/capshot.exe pkg/
          Copy-Item target/x86_64-pc-windows-gnu/release/examples/probe.exe pkg/probe.exe -ErrorAction SilentlyContinue
          if (-not (Test-Path pkg/probe.exe)) { Copy-Item target/release/examples/probe.exe pkg/ }
          Copy-Item tools/win-x64/WebView2Loader.dll pkg/
          Copy-Item docs/testing-windows.md pkg/README-test.md
          Compress-Archive -Path pkg/* -DestinationPath "capshot-win-x64-$env:GITHUB_REF_NAME.zip"
          # 安装版：NSIS 默认名 CapsShot_<ver>_x64-setup.exe，按约定改带 tag 的名
          Copy-Item target/release/bundle/nsis/*-setup.exe "capshot-win-x64-$env:GITHUB_REF_NAME-setup.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: capshot-win-x64
          path: capshot-win-x64-*

  build-macos:
    needs: preflight
    if: needs.preflight.outputs.on-main == 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # 前端必须先于 cargo：custom-protocol 是编译期把 ui/dist 打进二进制
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build UI
        working-directory: ui
        shell: bash
        run: |
          npm ci
          npm run build
          for p in index overlay pin settings history about; do
            [ -f "dist/$p.html" ] || { echo "::error::dist/$p.html 未产出（vite.config.js 的 rollupOptions.input 漏页）"; exit 1; }
          done
      # 根目录 CLI；tauri build 产出 target/release/capshot（custom-protocol 默认开）
      # 与 bundle/macos/*.app、bundle/dmg/*.dmg（未签名/未公证，与 zip 同待遇）
      - name: Install root CLI
        run: npm ci
      - name: Tauri build (app + DMG)
        run: npm run tauri build -- --bundles dmg
      - run: cargo build --release -p capture-macos --example probe
      # 与 ci.yml / build-windows 同一条自检（判据与 LC_ALL=C 的坑都写在脚本里）
      - name: Verify binary embeds UI (custom-protocol)
        shell: bash
        run: bash scripts/verify-embed.sh target/release/capshot
      - name: Bundle .app + zip + dmg
        run: |
          chmod +x scripts/make-app.sh
          ./scripts/make-app.sh target/release/capshot dist/capshot.app
          cp target/release/examples/probe dist/probe
          zip -r "capshot-macos-arm64-${GITHUB_REF_NAME}.zip" dist/capshot.app dist/probe docs/testing-windows.md
          # 安装版：DMG 默认名 CapsShot_<ver>_aarch64.dmg，按约定改带 tag 的名
          cp target/release/bundle/dmg/*_aarch64.dmg "capshot-macos-arm64-${GITHUB_REF_NAME}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: capshot-macos-arm64
          path: capshot-macos-arm64-*

  release:
    needs: [preflight, build-windows, build-macos]
    if: needs.preflight.outputs.on-main == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "capshot-*"
          merge-multiple: true
      - name: Create Release
        run: |
          # 产物文件名带版本号（tag 名）：免安装 zip ×2 + 安装版（NSIS setup / DMG）。
          # 显式列四个文件，缺任何一个 gh 会直接报错（不让 release 静默少附件）
          gh release create "${GITHUB_REF_NAME}" \
            capshot-win-x64-"${GITHUB_REF_NAME}".zip \
            capshot-win-x64-"${GITHUB_REF_NAME}"-setup.exe \
            capshot-macos-arm64-"${GITHUB_REF_NAME}".zip \
            capshot-macos-arm64-"${GITHUB_REF_NAME}".dmg \
            --title "capshot ${GITHUB_REF_NAME}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 本 job 无 checkout：gh 不会从 GITHUB_REPOSITORY 推断仓库（cli/cli#3556），
          # 必须显式 GH_REPO，否则 "no repository context" 直接失败
          GH_REPO: ${{ github.repository }}
