name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: MSVC dev environment
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Locate rc.exe (embed-resource checks $RC first)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $rc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter rc.exe |
                Where-Object { $_.FullName -match '\\x64\\rc\.exe$' } |
                Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $rc) { Write-Error "rc.exe not found"; exit 1 }
          "RC=$($rc.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "using RC=$($rc.FullName)"
      - uses: Swatinem/rust-cache@v2
      # 前端必须先于 cargo：custom-protocol 是编译期把 ui/dist 打进二进制，
      # dist 缺失 = generate_context! panic，dist 过期 = 静默构建旧 UI
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install UI deps
        working-directory: ui
        run: npm ci
      - name: Typecheck UI
        working-directory: ui
        run: npm run typecheck
      - name: Build UI
        working-directory: ui
        shell: bash
        run: |
          npm run build
          for p in index overlay pin settings history editor; do
            [ -f "dist/$p.html" ] || { echo "::error::dist/$p.html 未产出（vite.config.js 的 rollupOptions.input 漏页）"; exit 1; }
          done
      - name: Unit tests
        run: cargo test --workspace
      - name: Release build (incl. desktop, MSVC/Xcode native)
        run: cargo build --release --workspace --examples --features desktop/custom-protocol
      - name: Clippy (report only)
        continue-on-error: true
        run: cargo clippy --workspace --all-targets
