[workspace]
resolver = "2"
members = [
    "crates/capture-core",
    "crates/capture-macos",
    "crates/capture-windows",
    "apps/desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
capture-core = { path = "crates/capture-core" }
